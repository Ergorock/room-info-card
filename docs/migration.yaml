# Remplacement des tuiles mushroom du dashboard "Tablette" (vue Général).
# Seules les listes `cards` changent : conserve les autres clés de tes grilles (style, card_mod…) et la structure vertical-stack « Etage » / « Autre ».
# Les binary_sensor de tendance et sensor.couleur_temp_* ne sont plus utilisés.

# --- Etage, grille 1 ---
square: false
type: grid
columns: 3
grid_options:
  columns: 9
  rows: 1
cards:
  - type: custom:room-info-card
    entity: sensor.ble_temperature_chambre_antoine
    name: Antoine
    icon: mdi:face-man
    luminance:
      entity: sensor.chambre_parents_rue_chambre_parents_rue_luminance
  - type: custom:room-info-card
    entity: sensor.ble_temperature_a4c13807558f
    name: Simon
    icon: mdi:face-man
    luminance:
      entity: sensor.sdb_parentale_sdb_parentale_luminance
  - type: custom:room-info-card
    entity: sensor.chambre_valentin_temperature
    name: Valentin
    icon: mdi:face-man
    luminance:
      entity: sensor.pallier_pallier_luminance

# --- Etage, grille 2 ---
square: false
